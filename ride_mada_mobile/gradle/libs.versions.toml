[versions]
compose-compiler = "1.5.14"
hilt = "2.51"
room = "2.6.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
maps-compose = "6.0.0"
coil = "2.6.0"
socket-io = "2.1.0"
firebase = "33.5.1"

[libraries]
# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = "androidx.hilt:hilt-navigation-compose:1.2.0"

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Retrofit
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# Google Maps
google-maps = "com.google.android.gms:play-services-maps:19.0.0"
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "maps-compose" }

# Socket.IO
socket-io-client = { module = "io.socket:socket.io-client", version.ref = "socket-io" }

# Coil
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging-ktx" }

# Navigation
androidx-navigation-compose = "androidx.navigation:navigation-compose:2.8.0"

# Autres
kotlinx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
androidx-lifecycle-viewmodel-compose = "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6"